services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: aegisvault
      POSTGRES_USER: aegisvault
      POSTGRES_PASSWORD: ${AEGIS_POSTGRES_PASSWORD:?Run scripts/prepare_compose.py first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisvault -d aegisvault"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  init:
    build: .
    image: aegisvault:local
    profiles: ["tools"]
    command: ["init", "--database-url-env", "AEGIS_DATABASE_URL"]
    environment:
      AEGIS_DATABASE_URL: ${AEGIS_DATABASE_URL:?Run scripts/prepare_compose.py first}
    volumes:
      - state:/state
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    image: aegisvault:local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - state:/state
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  state:
  pgdata:
